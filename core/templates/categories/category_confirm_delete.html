{% extends 'base.html' %}
{% block title %}{{ title }} | Smart Invent{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <section class="card p-4 p-lg-5 text-center">
                <i class="bi bi-trash3 text-danger display-4 mb-3"></i>
                <h1 class="h3 fw-bold">Delete Category?</h1>
                <p class="text-secondary">You are about to remove <strong>{{ category.name }}</strong>. This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <button type="submit" class="btn btn-danger">Delete</button>
                        <a href="{% url 'category_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </section>
        </div>
    </div>
</div>
{% endblock %}
