{% extends 'base.html' %}
{% block title %}Confirm Delete | Smart Invent{% endblock %}
{% block content %}<div class="container"><div class="row justify-content-center"><div class="col-md-6"><section class="card p-4 p-lg-5 text-center"><i class="bi bi-exclamation-octagon text-danger display-4 mb-3"></i><h1 class="h3 fw-bold">Delete this product?</h1><p class="text-secondary">You are about to delete <strong>{{ product.name }}</strong> ({{ product.sku }}). This action cannot be undone.</p><form method="post">{% csrf_token %}<div class="d-flex justify-content-center gap-2"><button type="submit" class="btn btn-danger">Yes, delete</button><a href="{% url 'product_list' %}" class="btn btn-outline-secondary">Cancel</a></div></form></section></div></div></div>{% endblock %}
